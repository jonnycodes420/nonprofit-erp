# BUILD-38 Part 2 — the gate. Runs the full suite on every push + PR to main.
# Any failure fails the job; pair this with branch protection (see MANUAL-STEPS.md)
# so a red run blocks merge. Action versions are pinned to tags here; convert to
# commit SHAs per MANUAL-STEPS.md ("Pin actions to SHAs") once you can resolve
# them online.
#
# Deploy rewire (2026-08-11): production deploys run FROM this workflow, gated
# on a green `test` job — Railway's GitHub auto-deploy is disconnected and the
# `deploy-railway` job below is the one path to the backend. `deploy-vercel`
# is wired the same way but stays dormant until the VERCEL_TOKEN secret exists
# (activation done 2026-08-12); until then Vercel's git auto-build still owned
# the frontend. Break-glass + full before/after: audit/deploy-rewire.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CHORE-2 · HAS THIS EXACT TREE ALREADY PASSED? ────────────────────────
  # A push to main is nearly always a merge of a PR whose head commit already
  # ran the full battery. If the TREE (not the commit) is byte-identical to
  # one that passed, running it again buys nothing and costs eight minutes on
  # the path between "merged" and "deployed".
  #
  # The key is `git rev-parse HEAD^{tree}`: it ignores the commit message, the
  # author and the parents, so a squash, a rebase or a merge commit with no
  # conflicts all hash to the tree that was tested. A merge that resolved a
  # conflict produces a DIFFERENT tree and is tested in full, which is exactly
  # right — that tree has never run anywhere.
  #
  # It only ever skips on a push to main, it names the run it trusted in the
  # log and in the summary, and `re-run all jobs` re-tests regardless because
  # the marker lookup is scoped to successful runs of this workflow.
  tree-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.t.outputs.tree }}
      skip: ${{ steps.t.outputs.skip }}
      trusted: ${{ steps.t.outputs.trusted }}
      docs_only: ${{ steps.d.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/tree-already-passed.js
        # The script writes tree/skip/trusted to $GITHUB_OUTPUT and a line to
        # $GITHUB_STEP_SUMMARY saying which run it trusted, or why it did not.
      # ARCH-1 · A PR THAT CHANGES ONLY DOCS RUNS THE GUARDS, NOT THE BATTERY.
      # Every changed path is under docs/ or ends in .md: nothing the battery
      # runs has changed, so the guards job (lint, TDZ, the arch-check, the
      # image-size check) answers alone and `test` reads as skipped. Only on a
      # pull_request; a push to main is already handled by the tree check.
      - id: d
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          other=$(printf '%s\n' "$changed" | grep -v -E '^docs/|\.md$' | grep . || true)
          if [ -n "$changed" ] && [ -z "$other" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR: the battery is skipped; the guards still run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ── CHORE-2 · THE GUARDS THAT ARE NOT SUITES ──────────────────────────────
  # Lint, the TDZ scan and the dependency audit are one-shot checks of the
  # tree. They used to sit inside the battery job; with six shards that would
  # run each of them six times for one answer. They run once, here, and the
  # shards wait on them — a tree that fails the TDZ scan would fail six
  # batteries in a dozen confusing ways, so failing in two seconds is kinder.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tree-check]
    if: needs.tree-check.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install server deps (locked)
        run: npm ci
      - name: Install client deps (locked)
        run: npm ci --prefix client
      # ── Guards: no-undef + rules-of-hooks (client ESLint) ──────────────────
      # emoji / brand-color allowlist / gradient-bar guards run as suites inside
      # run-all.sh (no-emoji, brand-allowlist, brand-glyph).
      - name: Lint guards (no-undef, rules-of-hooks)
        run: npm run lint --prefix client

      # ── TDZ self-references — the one class that reaches a browser past every
      # ── other gate. `const INK = INK;` parses, type-checks, lints clean and
      # passes every server suite, then throws ReferenceError at runtime and
      # replaces a whole screen with its error boundary. Five builds have paid for
      # it (BUILD-84, 89, 95, 96, 102), four of them via a blanket string replace
      # that rewrote a declaration along with its uses.
      #
      # Only the SELF-REFERENCE half is gated: `--all` reports ~200 read-above
      # candidates that are mostly parameters sharing a spelling with a later
      # binding, and a gate with false positives is one people learn to bypass. A
      # self-reference needs no judgement — it is always a bug. Runs BEFORE the
      # battery because it is two seconds and it explains failures the battery
      # would otherwise report as a dozen unrelated browser timeouts.
      - name: TDZ self-reference guard
        run: node scripts/ci/tdz-scan.js

      # ARCH-1 · the ratchet (docs/architecture/ARCHITECTURE.md): big files,
      # gift SQL in routes, fiscal-year copies, new scripts in the root, and
      # committed images over 500 KB. A count may go down, never up.
      - name: Architecture ratchet
        run: node scripts/ci/arch-check.js

      # HARDEN-1 · the daily error digest's parser, against a fixture log. No
      # server, no database: a parser that stops grouping by type and route
      # fails here, not on the morning the digest is wrong.
      - name: Error digest parser self-test
        run: node scripts/ci/error-digest.js --self-test

      # ── BUILD-75 B.6 — dependency audit at a FAILING threshold ─────────────
      # A new high/critical advisory fails the build unless it is listed in
      # audit/npm-audit-allowlist.json with a reason and a review-by date
      # (two no-fix-available highs are currently accepted there, with their
      # exposure analysis). scripts/ci/audit-gate.js is the gate.
      - name: npm audit gate (server)
        run: node scripts/ci/audit-gate.js .
      - name: npm audit gate (client)
        run: node scripts/ci/audit-gate.js client


  # ── CI-2 · THE PLAN, WRITTEN ONCE ─────────────────────────────────────────
  # Which suites go in which shard, from the cached suite timings (ARCH-1's
  # .generated/, never committed). Planned ONCE and handed to every matrix job
  # as an artifact: six jobs each restoring "the latest" cache could restore
  # different files if a run saved one in between, and two different plans
  # would run some suites twice and others never. The same planner is what
  # `SHARDS=6 bash tests/run-all.sh` runs on a laptop.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tree-check]
    if: needs.tree-check.outputs.skip != 'true' && needs.tree-check.outputs.docs_only != 'true'
    env:
      SHARDS: "6"
    steps:
      - uses: actions/checkout@v4
      # The newest timings this ref can see: this PR's own last run, else
      # main's (a PR's cache is visible to that PR only; main's to everyone).
      # The key never matches exactly, so restore-keys picks the newest.
      - name: Restore suite timings
        id: timings
        uses: actions/cache/restore@v4
        with:
          path: .generated/suite-timings.json
          key: suite-timings-plan-${{ github.run_id }}
          restore-keys: suite-timings-
      - name: Plan the shards
        run: |
          mkdir -p /tmp/plan
          bash tests/run-all.sh --plan /tmp/plan/plan.json
          # The timings the plan came from ride along, so combine refreshes
          # THEM with this run's seconds (a suite this run did not time keeps
          # its old number).
          if [ -f .generated/suite-timings.json ]; then cp .generated/suite-timings.json /tmp/plan/; fi
          echo "Plan: $(node -e 'const p=require("/tmp/plan/plan.json");console.log(p.totals.map((t,i)=>`shard ${i+1} ${t}s/${p.shards[i].length}`).join(" · "), "· untimed:", p.untimed.length)')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-plan
          path: /tmp/plan/
          retention-days: 7

  # ── CI-2 · THE BATTERY, A MATRIX OF SIX JOBS ──────────────────────────────
  # One job per shard, in parallel, each on its own runner with its own
  # Postgres service, its own server and its own client build. Each runs
  # `bash tests/run-all.sh` with SHARD_ONLY: the same entry point as a laptop,
  # running one shard of the plan above, and uploads what it ran. A shard job
  # is red when its own suites are; the `test` job below is the one that says
  # whether the battery passed.
  #
  # SIX shards: PR #294's suites took 2,770 s between them, the longest one
  # (numbers1-foot) 396 s. Six shards is ~460 s of suites each, plus about four
  # minutes a job spends installing, building the client and booting the
  # server: about ten minutes a shard. Five is ~550 s each (about thirteen
  # minutes); seven gains little because numbers1-foot alone is 396 s.
  #
  # (CHORE-2's matrix failed because every job ran the reporter for ALL
  # shards and found the others missing. A job now reports only its own
  # shard; only `test` reads them all.)
  shard:
    runs-on: ubuntu-latest
    # FLAKE-1: 45, not 25, so the Playwright step's three attempts fit inside
    # the job; a shard that installs on the first try takes what it always did.
    timeout-minutes: 45
    needs: [tree-check, guards, plan]
    if: needs.tree-check.outputs.skip != 'true' && needs.tree-check.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_loadtest
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U steward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches tests/run-all.sh's documented boot recipe.
      DATABASE_URL: postgresql://steward:steward@localhost:5544/steward_loadtest
      DB_SSL: disable                 # stock postgres image has no SSL (db.js honors this)
      JWT_SECRET: local-test-secret
      PORT: "5601"
      TEST_MODE: "1"                  # BUILD-75 rename (limiters off + test seams armed; DISABLE_RATE_LIMIT stays an accepted alias)
      SESSION_CACHE_TTL_MS: "0"       # deterministic: suites reuse fixed user ids (BUILD-38)
      RESEND_API_KEY: re_dummy_local
      RESEND_BASE_URL: http://localhost:5602
      DEMO_SMTP_FROM: noreply@stewardapp.dev
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_localtest
      # BUILD-94 Part 4 — the bounce/complaint webhook is signature-verified;
      # a throwaway secret so the suite can sign a real delivery.
      RESEND_WEBHOOK_SECRET: whsec_YnVpbGQ5NC1sb2NhbC13ZWJob29rLXNlY3JldCE=
      STRIPE_API_BASE: http://localhost:5603   # BUILD-45 — donation Stripe client → the portal suite's local mock
      DONOR_ACCOUNTS_ENABLED: "1"              # BUILD-46 feature flags — ON in CI so the suites drive them;
      NETWORK_SIGNUP_ENABLED: "1"              # OFF in prod (unset) until launch
      MIGC_CONTACT_EMAIL: migc-contact@example.org   # MIGC client-site suite captures the contact
      MIGC_EMAIL_FROM: noreply@stewardapp.dev        # notification through the :5602 sink
      # BUILD-89S 89a — the sealer that giving-source credentials are stored
      # behind. A THROWAWAY value: it protects nothing here, because CI holds
      # no real provider key. But it must be SET, because the feature refuses
      # to store a credential without one (there is no plaintext path), and a
      # suite that connects a source is correctly refused otherwise.
      STEWARD_CREDENTIAL_KEY: ci-only-throwaway-credential-key-0123456789
      # BUILD-90 90a — the PLATFORM-billing Stripe seam, the twin of
      # STRIPE_API_BASE above. The close link is the one billing path that
      # makes an outbound Stripe call, so the battery needs a mock for it
      # (close-link and trial-billing bind :5604). The three price ids are
      # values that mock answers for: a close link REFUSES to mint without a
      # configured price, which is correct in production and would otherwise
      # read here as a test failure.
      STRIPE_BILLING_SECRET_KEY: sk_test_dummy
      STRIPE_BILLING_API_BASE: http://localhost:5604
      STRIPE_PRICE_FOUNDING: price_test_founding
      STRIPE_PRICE_CORE: price_test_core
      STRIPE_PRICE_TEAM: price_test_team
      STRIPE_PRICE_T1000_MONTHLY: price_test_t1000m   # FIX-32: J11 signs up through public signup
      # PRICING-1: the record bands, monthly, yearly and the one-time setup fee
      STRIPE_PRICE_R500_MONTHLY: price_test_r500m
      STRIPE_PRICE_R500_YEARLY: price_test_r500y
      STRIPE_PRICE_R500_SETUP: price_test_r500s
      STRIPE_PRICE_R2500_MONTHLY: price_test_r2500m
      STRIPE_PRICE_R2500_YEARLY: price_test_r2500y
      STRIPE_PRICE_R2500_SETUP: price_test_r2500s
      STRIPE_PRICE_R10000_MONTHLY: price_test_r10000m
      STRIPE_PRICE_R10000_YEARLY: price_test_r10000y
      STRIPE_PRICE_R10000_SETUP: price_test_r10000s
      STRIPE_PRICE_R25000_MONTHLY: price_test_r25000m
      STRIPE_PRICE_R25000_YEARLY: price_test_r25000y
      STRIPE_PRICE_R25000_SETUP: price_test_r25000s
      FOUNDER_EMAIL: jonathan@stewardapp.dev   # From on the close-link welcome + the 7-day reminder
      DISABLE_BACKGROUND_TICKS: "1"   # SPEED: no periodic job fires mid-suite (the flake fix);
                                      # every sweep stays drivable via its ops route.
      # CI-2 — this job runs ONE shard of the plan. Between them the six
      # shards run every suite; the `test` job refuses the run if any suite
      # did not run exactly once.
      SHARDS: "6"
      SHARD_ONLY: ${{ matrix.shard }}
      SHARD_PLAN: /tmp/plan/plan.json
      SHARD_PGUSER: steward
      PGPASSWORD: steward
      # ── GTM-1a A · THE BROWSER LEGS RUN HERE NOW ─────────────────────────
      # They used to skip. `smoke-walk` opens every tab and every donor-profile
      # tab and fails on a blank screen, an error boundary, a 5xx or a console
      # error — it is the ONLY coverage screens have (CLAUDE.md: "Screens are
      # covered by tests/smoke-walk.test.js"), and it was asserting 104 things
      # on a laptop and 0 in CI. Every deploy for months went out on a battery
      # that had never opened a page.
      #
      # PLAYWRIGHT_DIR is the directory the two suites require `playwright`
      # from (default ~/steward-qa on Jonathan's machine). REQUIRE_BROWSER=1
      # turns "Playwright not found" / "dist not built" from a quiet SKIP into
      # a red suite, so this can never silently regress to what it was.
      PLAYWRIGHT_DIR: ${{ github.workspace }}/.playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      REQUIRE_BROWSER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server deps (locked)
        run: npm ci

      - name: Install client deps (locked)
        run: npm ci --prefix client

      # SPLIT-1 — this PR's routes against main's: the same method, path and
      # middleware chain, line for line, and two routes that can answer the
      # same request still in the same order. It prints the diff on every PR;
      # on a move-only build (a branch named split-*) the diff must be empty.
      - name: Route diff against main
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/ci/route-diff.js --against FETCH_HEAD ${{ startsWith(github.head_ref, 'split-') && '--strict' || '' }}

      # ── Playwright + Chromium + WebKit, and their system packages, cached ──
      # Pinned to the same version Jonathan's ~/steward-qa runs, so a suite
      # that passes on the laptop and fails here is a real difference and not
      # a browser version. FLAKE-1: the system packages (181 .debs, 114 MB) are
      # cached too. On 5 Nov the Azure mirror sent them at a few KB/s and every
      # build lost shards here, apt exit 100, before a test ran. With the .debs
      # restored apt downloads nothing. The caches are RESTORED here and SAVED
      # right after the install (not at the end of the job, which actions/cache
      # skips when a suite fails), and `playwright-cache` below fills them from
      # main, where every PR can read them.
      - name: Playwright cache keys
        id: pw-keys
        run: echo "debs=pw-debs-${ImageOS:-ubuntu}-${ImageVersion:-unknown}-1.61.1-webkit" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright (package + browsers)
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .playwright
            .playwright-browsers
          # PROFILE-2: WebKit too (smoke-walk §scroll drives Safari's engine), so the key names it.
          key: playwright-${{ runner.os }}-1.61.1-webkit
      - name: Restore Playwright's system packages (.deb)
        id: pw-debs
        uses: actions/cache/restore@v4
        with:
          path: .playwright-debs
          key: ${{ steps.pw-keys.outputs.debs }}
          restore-keys: pw-debs-
      # FIX-34 gave this step its own ceiling; FIX-48 made apt wait for its
      # lock. FLAKE-1: scripts/ci/install-playwright.sh caps every attempt
      # (the system packages under `sudo timeout`, so a hung apt-get dies with
      # it), repairs dpkg between attempts, launches both browsers to prove
      # them, and tries three times before the step fails.
      - name: Install Playwright + Chromium
        timeout-minutes: 35
        env:
          PW_DEB_CACHE: ${{ github.workspace }}/.playwright-debs
        run: bash scripts/ci/install-playwright.sh 1.61.1
      - name: Save Playwright (package + browsers)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .playwright
            .playwright-browsers
          key: playwright-${{ runner.os }}-1.61.1-webkit
      - name: Save Playwright's system packages (.deb)
        if: steps.pw-debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .playwright-debs
          key: ${{ steps.pw-keys.outputs.debs }}

      - uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: /tmp/plan

      # tests/shard.sh creates this shard's database, boots its own server on
      # its own port block, waits for /health, runs its suites serially and
      # tears everything down. A shard that holds a suite needing the demo
      # seeds its own (FIX-1 §11), and one that holds a browser suite builds
      # client/dist for its own API.
      - name: The battery (shard ${{ matrix.shard }} of 6)
        run: bash tests/run-all.sh
        env:
          SHARD_OUT: /tmp/steward-shards
          SUITE_LOG_DIR: /tmp/steward-suite-logs

      - name: Server log on failure
        if: failure()
        run: for f in /tmp/steward-shards/server-*.log; do echo "── $f"; tail -80 "$f"; done || true

      # What this shard ran, for the `test` job: its result line per suite,
      # and every suite's full output and the server log, so a red run's
      # assertions are downloadable. Uploaded whatever happened; a shard that
      # crashed before writing its result uploads none, and `test` says so.
      - name: Gather this shard's results
        if: always()
        run: |
          mkdir -p /tmp/shard-artifact/logs
          cp /tmp/steward-shards/shard-*.json /tmp/steward-shards/server-*.log /tmp/shard-artifact/ 2>/dev/null || true
          cp -R /tmp/steward-suite-logs/shard-* /tmp/shard-artifact/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: /tmp/shard-artifact/
          if-no-files-found: ignore
          retention-days: 7

  # ── CI-2 · DID THE BATTERY PASS? (the one required check, named `test`) ───
  # Reads every shard's result and refuses the run when a suite failed, a
  # shard produced no result (it crashed, timed out or was cancelled), a suite
  # discovered in this tree did not run exactly once, or a suite's pass count
  # dropped below audit/suite-counts.json. Named `test` because that is the
  # status check main's ruleset requires; the deploys wait on it.
  # `always()` so a red or crashed shard still gets a verdict (a skipped
  # required check would read as passed); a docs-only PR or an already-tested
  # tree skips it, as before.
  combine:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tree-check, guards, plan, shard]
    if: always() && needs.tree-check.outputs.skip != 'true' && needs.tree-check.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: The plan and guards ran
        run: |
          echo "guards: ${{ needs.guards.result }} · plan: ${{ needs.plan.result }} · shards: ${{ needs.shard.result }}"
          [ "${{ needs.guards.result }}" = "success" ] && [ "${{ needs.plan.result }}" = "success" ] \
            || { echo "::error::the guards or the plan did not pass, so the battery is not green"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-[0-9]*
          path: /tmp/steward-shards
          merge-multiple: true
      - name: Every suite, one summary
        if: always()
        env:
          SUITE_LOG_DIR: /tmp/steward-shards/logs
        run: |
          mkdir -p .generated
          if [ -f /tmp/plan/suite-timings.json ]; then cp /tmp/plan/suite-timings.json .generated/; fi
          node scripts/ci/shard-report.js --out /tmp/steward-shards --plan /tmp/plan/plan.json --timings .generated/suite-timings.json
      - name: Every suite ran exactly once
        if: always()
        run: SHARD_RESULTS=/tmp/steward-shards SHARD_COUNT=6 node tests/every-test-runs.test.js
      # THE COUNT RATCHET. A suite can go green by asserting less, so the
      # per-suite pass counts are compared against audit/suite-counts.json and
      # a DROP fails the build.
      - name: No suite may assert less than it did
        if: always()
        env:
          REQUIRE_BROWSER: "1"
        run: node scripts/ci/shard-combine.js --in /tmp/steward-shards --shards 6 --baseline audit/suite-counts.json
      # The timings this run measured, for the next plan: in this ref's cache,
      # and as an artifact, which main's `timings` job carries into main's cache
      # when the tree check skips the battery after a squash.
      - name: Save suite timings
        if: always() && hashFiles('.generated/suite-timings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .generated/suite-timings.json
          key: suite-timings-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.generated/suite-timings.json') != ''
        with:
          name: suite-timings
          path: .generated/suite-timings.json
          retention-days: 30

  # ── CI-2 · MAIN'S TIMINGS ─────────────────────────────────────────────────
  # A PR's cache is visible only to that PR, and a squash of a green PR skips
  # the battery on main (tree-check). So without this no PR ever found timings
  # and every plan was blind (PR #294: one shard 2,095 s, the others ~340 s).
  # When main skips, its timings are the trusted run's: copied into main's
  # cache, where every PR can read them.
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tree-check]
    if: github.event_name == 'push' && needs.tree-check.outputs.skip == 'true' && needs.tree-check.outputs.trusted != ''
    steps:
      - name: The trusted run's timings
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ needs.tree-check.outputs.trusted }}
        run: |
          mkdir -p .generated
          if gh run download "$TRUSTED" --repo "$GITHUB_REPOSITORY" --name suite-timings --dir .generated; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Run $TRUSTED kept no suite-timings artifact; main's cache is unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.get.outputs.found == 'true'
        uses: actions/cache/save@v4
        with:
          path: .generated/suite-timings.json
          key: suite-timings-${{ github.run_id }}-${{ github.run_attempt }}

  # ── FLAKE-1 · THE PLAYWRIGHT CACHES LIVE ON MAIN ──────────────────────────
  # A cache saved by a PR is visible to that PR alone; main's is visible to
  # every PR. A push to main almost never runs the battery (tree-check skips a
  # tree that already passed), so without this job the browsers and the
  # system packages were cached nowhere a new PR could read, and every PR's
  # first run fetched 114 MB from the Ubuntu mirror. This job only LOOKS when
  # both caches are there, installs and saves when one is missing, and gates
  # nothing: no job needs it.
  playwright-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      PLAYWRIGHT_DIR: ${{ github.workspace }}/.playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PW_DEB_CACHE: ${{ github.workspace }}/.playwright-debs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright cache keys
        id: pw-keys
        run: echo "debs=pw-debs-${ImageOS:-ubuntu}-${ImageVersion:-unknown}-1.61.1-webkit" >> "$GITHUB_OUTPUT"
      - name: Is the browser cache there?
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .playwright
            .playwright-browsers
          key: playwright-${{ runner.os }}-1.61.1-webkit
          lookup-only: true
      - name: Are the system packages there?
        id: pw-debs
        uses: actions/cache/restore@v4
        with:
          path: .playwright-debs
          key: ${{ steps.pw-keys.outputs.debs }}
          lookup-only: true
      - name: Install Playwright + Chromium + WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true' || steps.pw-debs.outputs.cache-hit != 'true'
        timeout-minutes: 35
        run: bash scripts/ci/install-playwright.sh 1.61.1
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .playwright
            .playwright-browsers
          key: playwright-${{ runner.os }}-1.61.1-webkit
      - if: steps.pw-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .playwright-debs
          key: ${{ steps.pw-keys.outputs.debs }}

  # ── STAGE-1 · WHICH LANE THIS MERGE TAKES ───────────────────────────────
  # Only once the repo variable STAGING_ENABLED is 'true'. `staging` (the
  # default): deploy-staging and staging-walk run, prod waits for Ship on /ops.
  # `hotfix`: the PR has the hotfix label and a "Hotfix reason: …" line, so the
  # prod jobs below run as they always did (and staging is deployed too).
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    outputs:
      lane: ${{ steps.l.outputs.lane }}
      reason: ${{ steps.l.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-lane.js

  # ── Deploy gate: Railway backend (deploy rewire, 2026-08-11) ──────────────
  # Runs ONLY on push to main, ONLY after a green test job.
  #
  # FLAKE-1 · NO DEPLOY IS EVER DROPPED. Both deploy jobs used to share ONE
  # concurrency group, "deploy-main", with cancel-in-progress: false. GitHub
  # holds at most one running and ONE pending job per group, and a newer
  # pending job cancels the older pending one, whatever cancel-in-progress
  # says. With two merges close together: A's Railway deploy runs, A's Vercel
  # deploy waits, B's Railway deploy arrives and cancels A's Vercel deploy,
  # then B's Vercel deploy cancels B's Railway deploy. B's backend never
  # shipped. Now:
  #   · each deploy job's group is its own AND per commit
  #     (deploy-railway-<sha>): no other merge's job is ever in it, so no
  #     other merge can cancel it, and a re-run of the same commit waits for
  #     the first instead of overlapping it;
  #   · scripts/ci/deploy-turnstile.js is the queue: the job waits until every
  #     OLDER push-to-main run has finished its own deploy-railway, so deploys
  #     go out one at a time in merge order, every one of them; and
  #   · it refuses to put back an OLDER commit than the one live (a re-run of
  #     an old run), so the latest merge is always the one left live.
  # RAILWAY_TOKEN is a project-scoped token ("github-actions-deploy") in
  # Actions secrets. Break-glass if Actions is down: manual `railway up` from
  # a local checkout — see audit/deploy-rewire.md.
  deploy-railway:
    runs-on: ubuntu-latest
    # FLAKE-1: 80, not 25: up to 50 minutes waiting its turn, then the deploy.
    timeout-minutes: 80
    needs: [tree-check, combine, lane]
    # `always()` because the battery is SKIPPED when this exact tree already
    # passed, and a skipped job would otherwise take the deploy down with it.
    # STAGE-1: with the repo variable STAGING_ENABLED unset this is exactly the
    # old condition (the `lane` job is skipped and not read). Once it is 'true',
    # a merge deploys here only on the hotfix lane; every other merge goes to
    # staging and prod moves when Ship is pressed on /ops (ship.yml).
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.combine.result == 'success' || needs.tree-check.outputs.skip == 'true')
      && (vars.STAGING_ENABLED != 'true' || needs.lane.outputs.lane == 'hotfix')
    concurrency:
      group: deploy-railway-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the turnstile compares this commit with the live one

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for the merges before this one to deploy (FLAKE-1)
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-turnstile.js --job deploy-railway --live-health https://nonprofit-erp-production.up.railway.app/health

      # Retried: the postinstall downloads a binary from GitHub releases and a
      # runner-side TLS/network blip failed a whole deploy once (2026-08-12,
      # run 31558654336) — three attempts with a pause absorbs that class.
      - name: Install Railway CLI
        if: steps.turn.outputs.deploy == 'true'
        run: |
          for i in 1 2 3; do
            npm install -g @railway/cli && break
            echo "install attempt $i failed; retrying in 10s"; sleep 10
            [ "$i" = "3" ] && exit 1
          done
          railway --version

      # server.js reads .build-sha at boot and reports it on /health — the
      # verify step below asserts prod is actually serving THIS commit.
      - name: Stamp build SHA
        if: steps.turn.outputs.deploy == 'true'
        run: printf '%s' "$GITHUB_SHA" > .build-sha

      - name: Deploy to Railway
        if: steps.turn.outputs.deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service nonprofit-erp --ci

      # SCALE-1: the worker service gets the same build once it exists. Until
      # Jonathan creates it and sets the repo variable RAILWAY_WORKER_SERVICE
      # (NEEDS-JONATHAN 0-SCALE-1), this step is skipped and the web service
      # keeps running the jobs itself.
      - name: Deploy the worker to Railway
        if: ${{ steps.turn.outputs.deploy == 'true' && vars.RAILWAY_WORKER_SERVICE != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --ci

      # DEPLOY-1: the web AND the worker. The worker has no public address;
      # it writes a heartbeat row with its build and role, and the web's
      # /health carries the newest one as `worker`.
      - name: Verify prod is healthy at this commit (timeout 5 min)
        if: steps.turn.outputs.deploy == 'true'
        env:
          WANT_WORKER: ${{ vars.RAILWAY_WORKER_SERVICE != '' && '1' || '' }}
        run: |
          echo "Polling /health for status:ok + buildSha == $GITHUB_SHA${WANT_WORKER:+ (web and worker)} …"
          for i in $(seq 1 60); do
            body=$(curl -sf --max-time 10 https://nonprofit-erp-production.up.railway.app/health || true)
            read -r sha wsha wrole <<< "$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d),w=j.worker||{};console.log((j.buildSha||'-')+' '+(w.buildSha||'-')+' '+(w.role||'-'))}catch{console.log('- - -')}})")"
            ok=$(printf '%s' "$body" | grep -c '"status":"ok"' || true)
            if [ "$ok" -ge 1 ] && [ "$sha" = "$GITHUB_SHA" ] && { [ -z "$WANT_WORKER" ] || { [ "$wsha" = "$GITHUB_SHA" ] && [ "$wrole" = "worker" ]; }; }; then
              echo "OK: prod healthy at $sha${WANT_WORKER:+, worker at $wsha ($wrole)}"; exit 0
            fi
            echo "  [$i/60] status-ok=$ok buildSha=$sha${WANT_WORKER:+ worker=$wsha ($wrole)}"
            sleep 5
          done
          echo "FAIL: prod never became healthy at $GITHUB_SHA within 5 minutes."
          echo "Prod may still be serving the previous deploy — check Railway deployments."
          exit 1

      # HARDEN-1: AI is off in every test, so the only check that a model call
      # works on prod is this one: one Ask and one Agent plan on the prod demo
      # org through the read-only preview routes (nothing is saved). A red here
      # means Ask or the Agent is broken on prod right now (FIX-29's class).
      # DEPLOY-1: it waits for /ready and this build (web and worker) first,
      # and asks a failed Ask once more 15 s later before it fails.
      - name: Prod AI smoke (one Ask, one Agent plan, saves nothing)
        if: steps.turn.outputs.deploy == 'true'
        env:
          PROD_AI_SMOKE_WAIT_SHA: ${{ github.sha }}
          PROD_AI_SMOKE_WORKER: ${{ vars.RAILWAY_WORKER_SERVICE != '' && '1' || '' }}
        run: node scripts/ci/prod-ai-smoke.js

  # ── Deploy gate: Vercel frontend (same rules, DORMANT until activated) ────
  # No ignored-build-step (it evaluates while CI is pending and never retries).
  # Instead: this job deploys via Vercel CLI after green tests; once proven,
  # Vercel's git auto-build gets disabled (vercel.json git.deploymentEnabled).
  # DORMANT GATE: the job-level `if` reads the repository VARIABLE
  # VERCEL_DEPLOY_ENABLED, so until it is set to 'true' the job renders as
  # SKIPPED (grey) — never a misleading green "success" that deployed nothing.
  # Activation (DONE — token + variable are set): set the VERCEL_TOKEN secret AND
  # `gh variable set VERCEL_DEPLOY_ENABLED --body true`. Until then Vercel's
  # git auto-build continues to own production so the frontend can always
  # deploy. Enabled-but-no-token is a misconfiguration and fails loudly.
  deploy-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # FLAKE-1: waiting its turn, then the deploy
    needs: [tree-check, combine, lane]
    # `always()` because the battery is SKIPPED when this exact tree already
    # passed, and a skipped job would otherwise take the deploy down with it.
    # STAGE-1: the same lane rule as deploy-railway.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.combine.result == 'success' || needs.tree-check.outputs.skip == 'true') && vars.VERCEL_DEPLOY_ENABLED == 'true'
      && (vars.STAGING_ENABLED != 'true' || needs.lane.outputs.lane == 'hotfix')
    concurrency:
      group: deploy-vercel-${{ github.sha }}   # FLAKE-1: see deploy-railway
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_bmpIjp9a9Cji8y2NqHsEuewv
      VERCEL_PROJECT_ID: prj_OCO0p927wc7CszoQS9PEEnDg7mIy
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for the merges before this one to deploy (FLAKE-1)
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-turnstile.js --job deploy-vercel --live-meta https://www.stewardapp.dev/

      - name: Deploy to Vercel
        if: steps.turn.outputs.deploy == 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_DEPLOY_ENABLED is true but the VERCEL_TOKEN secret is not set — refusing."
            echo "Set the VERCEL_TOKEN secret, or unset VERCEL_DEPLOY_ENABLED."
            exit 1
          fi
          # BUILD_SHA is the meta-tag fallback: the remote Vercel build has no
          # .git and no GITHUB_SHA, so the SHA rides in as an explicit build env.
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --build-env BUILD_SHA="$GITHUB_SHA"

      - name: Verify live site serves this commit (timeout 5 min)
        if: steps.turn.outputs.deploy == 'true'
        run: |
          echo "Polling https://www.stewardapp.dev for build-sha == $GITHUB_SHA …"
          for i in $(seq 1 60); do
            sha=$(curl -sf --max-time 10 https://www.stewardapp.dev/ | grep -o 'name="build-sha" content="[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "OK: live site serving $sha"; exit 0; fi
            echo "  [$i/60] build-sha=${sha:-none}"
            sleep 5
          done
          echo "FAIL: live site never served build-sha $GITHUB_SHA within 5 minutes."
          exit 1

  # ── STAGE-1 · EVERY MERGE GOES TO STAGING FIRST ───────────────────────────
  # Only once STAGING_ENABLED is 'true' (docs/needs-jonathan/STAGE-1.md says
  # what Jonathan sets first). Staging is Railway's `staging` environment (its
  # own web, worker and Postgres; Stripe test keys; mail to the capture sink)
  # and a second Vercel project whose production domain is
  # staging.stewardapp.dev. The same FLAKE-1 turnstile queues these deploys in
  # merge order. RAILWAY_STAGING_TOKEN is a project token scoped to the staging
  # environment: it cannot deploy prod.
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    needs: [tree-check, combine, lane]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
      && (needs.combine.result == 'success' || needs.tree-check.outputs.skip == 'true')
    concurrency:
      group: deploy-staging-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL || 'https://staging.stewardapp.dev' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Staging is configured
        env:
          HAS_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN != '' }}
          VERCEL_STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
        run: |
          [ -n "$STAGING_API_URL" ] || { echo "::error::STAGING_ENABLED is true but the repo variable STAGING_API_URL is not set (docs/needs-jonathan/STAGE-1.md)."; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::the RAILWAY_STAGING_TOKEN secret is not set."; exit 1; }
          [ -n "$VERCEL_STAGING_PROJECT_ID" ] || { echo "::error::the repo variable VERCEL_STAGING_PROJECT_ID is not set."; exit 1; }
      - name: Wait for the merges before this one to reach staging (FLAKE-1)
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-turnstile.js --job deploy-staging --live-health "$STAGING_API_URL/health"
      - name: The walk on this commit is pending
        if: steps.turn.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/$GITHUB_SHA" -f state=pending -f context=staging/walk -f description="Deploying to staging" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
      - name: Install Railway CLI
        if: steps.turn.outputs.deploy == 'true'
        run: |
          for i in 1 2 3; do
            npm install -g @railway/cli && break
            echo "install attempt $i failed; retrying in 10s"; sleep 10
            [ "$i" = "3" ] && exit 1
          done
      - name: Stamp build SHA
        if: steps.turn.outputs.deploy == 'true'
        run: printf '%s' "$GITHUB_SHA" > .build-sha
      - name: Deploy staging's web and worker
        if: steps.turn.outputs.deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          railway up --service "${{ vars.RAILWAY_STAGING_WEB_SERVICE || 'web' }}" --ci
          railway up --service "${{ vars.RAILWAY_STAGING_WORKER_SERVICE || 'worker' }}" --ci
      - name: Deploy staging's frontend
        if: steps.turn.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_bmpIjp9a9Cji8y2NqHsEuewv
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
        run: |
          # vercel.json names prod's API host; staging's copy names staging's (and fails if prod's is left).
          node scripts/ci/vercel-staging-config.js "$STAGING_API_URL"
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --local-config vercel.staging.json \
            --build-env BUILD_SHA="$GITHUB_SHA" --build-env VITE_API_URL="$STAGING_API_URL"
      - name: Staging serves this commit (web, worker, frontend), and says it is staging
        if: steps.turn.outputs.deploy == 'true'
        run: node scripts/ci/wait-live.js --sha "$GITHUB_SHA" --api "$STAGING_API_URL" --worker --env staging --frontend "$STAGING_APP_URL" --minutes 6
      - name: A failed staging deploy is a failed walk
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/$GITHUB_SHA" -f state=failure -f context=staging/walk -f description="The staging deploy failed, so nothing was walked" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
    outputs:
      deployed: ${{ steps.turn.outputs.deploy }}

  # ── STAGE-1 · THE STAGING WALK ────────────────────────────────────────────
  # Sign in, Home, a profile, record a gift, an import and its undo, a report,
  # on staging (scripts/ci/staging-walk.js). It writes the commit status
  # `staging/walk`, which /ops's Ship button reads: a red walk turns this run
  # red, says why in the summary, and Ship stays off until a green one.
  staging-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [deploy-staging]
    if: always() && needs.deploy-staging.result == 'success' && needs.deploy-staging.outputs.deployed == 'true'
    permissions:
      contents: read
      statuses: write
    env:
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL || 'https://staging.stewardapp.dev' }}
      STAGING_WALK_EMAIL: walker@walk.staging.invalid
      PLAYWRIGHT_DIR: ${{ github.workspace }}/.playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PW_DEB_CACHE: ${{ github.workspace }}/.playwright-debs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright cache keys
        id: pw-keys
        run: echo "debs=pw-debs-${ImageOS:-ubuntu}-${ImageVersion:-unknown}-1.61.1-webkit" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            .playwright
            .playwright-browsers
          key: playwright-${{ runner.os }}-1.61.1-webkit
      - uses: actions/cache/restore@v4
        with:
          path: .playwright-debs
          key: ${{ steps.pw-keys.outputs.debs }}
          restore-keys: pw-debs-
      - name: Install Playwright + Chromium
        timeout-minutes: 35
        run: bash scripts/ci/install-playwright.sh 1.61.1
      - name: Walk staging
        id: walk
        env:
          STAGING_WALK_PASSWORD: ${{ secrets.STAGING_WALK_PASSWORD }}
        run: node scripts/ci/staging-walk.js --out walk.json
      - name: Write the walk's result on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f walk.json ]; then
            state=$(node -e "process.stdout.write(require('./walk.json').ok ? 'success' : 'failure')")
            line=$(node -e "process.stdout.write(require('./walk.json').line.slice(0,140))")
          else
            state=failure; line="The walk did not finish (see the run)."
          fi
          gh api "repos/${{ github.repository }}/statuses/$GITHUB_SHA" -f state="$state" -f context=staging/walk -f description="$line" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          echo "staging/walk on ${GITHUB_SHA:0:7}: $state · $line"
