# HARDEN-1 item 6 · THE DAILY ERROR DIGEST.
#
# Reads yesterday's (UTC) error lines from the production service's logs with
# the Railway CLI and the project-scoped RAILWAY_TOKEN that ci.yml's
# deploy-railway job already uses (service nonprofit-erp, environment
# production; read only), groups them by type and by route with
# scripts/error-digest.js, and writes docs/errors/YYYY-MM-DD.md.
#
# FIX-38: main's ruleset refuses a direct push (the required check "test"), so
# the digest goes in as a pull request: branch digest/YYYY-MM-DD, titled
# "Error digest, Oct 14, 2026", the top errors in its description, set to
# squash-merge itself once the required check passes. If an earlier digest PR
# is still open, today's file is added to it and it is retitled, never a second
# PR. The branch is rebuilt on today's main each time, so it is never behind.
# A PR opened with the workflow's own token starts no other workflow; the
# settings that needs are in docs/decisions/tests-and-ci.md.
name: Error digest

on:
  schedule:
    - cron: "23 6 * * *"   # 06:23 UTC, after the UTC day it reads has closed
  workflow_dispatch:
    inputs:
      day:
        description: "The UTC day to digest (YYYY-MM-DD). Empty means yesterday."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: error-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE: nonprofit-erp
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: |
          for i in 1 2 3; do
            npm install -g @railway/cli && break
            echo "install attempt $i failed; retrying in 10s"; sleep 10
            [ "$i" = "3" ] && exit 1
          done
          railway --version

      - name: Read the day's error lines
        id: logs
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The error digest cannot read the logs because the RAILWAY_TOKEN repository secret is not set."
            exit 1
          fi
          DAY="${{ github.event.inputs.day }}"
          [ -n "$DAY" ] || DAY=$(date -u -d "yesterday" +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          : > logs.jsonl
          # A day can span several deployments, and `railway logs` reads one at a
          # time: read every deployment created from the day before through now.
          SINCE=$(date -u -d "$DAY -1 day" +%FT%TZ)
          railway deployment list --service "$SERVICE" --environment "$ENVIRONMENT" --limit 40 --json > deployments.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("deployments.json", "utf8"));
            const since = process.argv[1];
            const ids = d.filter(x => x.createdAt >= since).map(x => x.id);
            if (!ids.length && d[0]) ids.push(d[0].id);   // the one that was live all day
            const older = d.find(x => x.createdAt < since && x.status === "SUCCESS");
            if (older && !ids.includes(older.id)) ids.push(older.id);   // live at the start of the day
            console.log(ids.join("\n"));
          ' "$SINCE" > ids.txt
          while read -r id; do
            [ -n "$id" ] || continue
            echo "reading deployment $id"
            railway logs "$id" --service "$SERVICE" --environment "$ENVIRONMENT" --lines 5000 --filter "@level:error" --json >> logs.jsonl || echo "could not read $id"
          done < ids.txt
          wc -l logs.jsonl

      - name: Write the digest
        run: node scripts/error-digest.js --in logs.jsonl --day "${{ steps.logs.outputs.day }}"

      - name: Open or update the digest pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.logs.outputs.day }}
        run: |
          git config user.name "steward-error-digest"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "docs/errors/$DAY.md" "$RUNNER_TEMP/digest.md"
          OPEN=$(gh pr list --state open --base main --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("digest/"))] | sort_by(.number) | .[0] // empty | "\(.number) \(.headRefName)"')
          PR=""; BRANCH="digest/$DAY"
          [ -n "$OPEN" ] && { PR=${OPEN%% *}; BRANCH=${OPEN#* }; }
          # Rebuild the branch on today's main, keep the days already on it.
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          if [ -n "$PR" ]; then
            git fetch origin "$BRANCH"
            git diff --name-only origin/main "origin/$BRANCH" -- docs/errors | while read -r f; do
              git checkout "origin/$BRANCH" -- "$f"
            done
          fi
          cp "$RUNNER_TEMP/digest.md" "docs/errors/$DAY.md"
          git add docs/errors
          if git diff --cached --quiet origin/main; then echo "The digest for $DAY is already on main."; exit 0; fi
          git commit -m "Error digest for $DAY"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          TITLE="Error digest, $(date -u -d "$DAY" '+%b %-d, %Y')"
          {
            for f in $(git diff --name-only origin/main HEAD -- docs/errors | sort -r); do
              # The heading, the one-sentence total and the five most frequent kinds.
              awk '/^# /{print "## " substr($0,3); next} /^## By type/{t=1; next} /^## /{t=0} t && /^\|/{if (++n <= 7) print; next} !t && n==0 && NF{print}' "$f"
              echo; echo "Full digest: \`$f\`"; echo
            done
            echo "Opened by the Error digest workflow, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. It merges itself once the required check passes."
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            if ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then
              echo "::error::The digest for $DAY is on branch $BRANCH, but GitHub refused to open its pull request. Turn on Settings, Actions, General, Workflow permissions, \"Allow GitHub Actions to create and approve pull requests\"."
              exit 1
            fi
            PR=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          echo "Digest PR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR"
          if ! gh pr merge "$PR" --squash --auto; then
            echo "::warning::Digest PR #$PR is open but could not be set to merge itself. Turn on Settings, General, Pull Requests, \"Allow auto-merge\"."
          fi
