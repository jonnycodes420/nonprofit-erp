# HARDEN-1 item 6 · THE DAILY ERROR DIGEST.
#
# Reads yesterday's (UTC) error lines from the production service's logs with
# the Railway CLI and the project-scoped RAILWAY_TOKEN that ci.yml's
# deploy-railway job already uses (service nonprofit-erp, environment
# production; read only), groups them by type and by route with
# scripts/error-digest.js, and posts it as that day's issue.
#
# FIX-44: the digest is ONE GITHUB ISSUE PER DAY, titled "Error digest, Oct
# 19, 2026", with the digest (the top errors by type and by route) as its body.
# If that day's issue is already open it is edited, never a second one. It
# needs only this workflow's GITHUB_TOKEN with issues write: no branch, no pull
# request, no repository setting. (FIX-38's pull request needed three settings
# and a token so the required check would run; that path is gone.)
name: Error digest

on:
  schedule:
    - cron: "23 6 * * *"   # 06:23 UTC, after the UTC day it reads has closed
  workflow_dispatch:
    inputs:
      day:
        description: "The UTC day to digest (YYYY-MM-DD). Empty means yesterday."
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: error-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE: nonprofit-erp
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: |
          for i in 1 2 3; do
            npm install -g @railway/cli && break
            echo "install attempt $i failed; retrying in 10s"; sleep 10
            [ "$i" = "3" ] && exit 1
          done
          railway --version

      - name: Read the day's error lines
        id: logs
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The error digest cannot read the logs because the RAILWAY_TOKEN repository secret is not set."
            exit 1
          fi
          DAY="${{ github.event.inputs.day }}"
          [ -n "$DAY" ] || DAY=$(date -u -d "yesterday" +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          : > logs.jsonl
          # A day can span several deployments, and `railway logs` reads one at a
          # time: read every deployment created from the day before through now.
          SINCE=$(date -u -d "$DAY -1 day" +%FT%TZ)
          railway deployment list --service "$SERVICE" --environment "$ENVIRONMENT" --limit 40 --json > deployments.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("deployments.json", "utf8"));
            const since = process.argv[1];
            const ids = d.filter(x => x.createdAt >= since).map(x => x.id);
            if (!ids.length && d[0]) ids.push(d[0].id);   // the one that was live all day
            const older = d.find(x => x.createdAt < since && x.status === "SUCCESS");
            if (older && !ids.includes(older.id)) ids.push(older.id);   // live at the start of the day
            console.log(ids.join("\n"));
          ' "$SINCE" > ids.txt
          while read -r id; do
            [ -n "$id" ] || continue
            echo "reading deployment $id"
            railway logs "$id" --service "$SERVICE" --environment "$ENVIRONMENT" --lines 5000 --filter "@level:error" --json >> logs.jsonl || echo "could not read $id"
          done < ids.txt
          wc -l logs.jsonl

      - name: Write the digest
        run: node scripts/error-digest.js --in logs.jsonl --day "${{ steps.logs.outputs.day }}" --out "$RUNNER_TEMP/errors"

      - name: Open or update the day's digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.logs.outputs.day }}
        run: |
          TITLE="Error digest, $(date -u -d "$DAY" '+%b %-d, %Y')"
          # An issue body holds 65,536 characters; the digest leads with the
          # totals and the most frequent kinds, so a cut keeps the top errors.
          node -e '
            const fs = require("fs");
            const [file, out, run] = process.argv.slice(1);
            let page = fs.readFileSync(file, "utf8");
            const foot = `\n\nPosted by the Error digest workflow, run ${run}.`;
            const room = 60000 - foot.length;
            if (page.length > room) page = page.slice(0, room).replace(/\n[^\n]*$/, "") + "\n\nThe rest was cut to fit an issue.";
            fs.writeFileSync(out, page + foot);
          ' "$RUNNER_TEMP/errors/$DAY.md" "$RUNNER_TEMP/body.md" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --limit 20 \
                --jq "[.[] | select(.title == \"$TITLE\")] | sort_by(.number) | .[0].number // empty")
          if [ -n "$N" ]; then
            gh issue edit "$N" --body-file "$RUNNER_TEMP/body.md"
          else
            URL=$(gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
            N=${URL##*/}
          fi
          echo "Digest issue: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$N"
          echo "Error digest for $DAY: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$N" >> "$GITHUB_STEP_SUMMARY"
