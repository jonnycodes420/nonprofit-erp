<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steward</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <!-- BUILD-28: the landing hero is now an image-forward PHOTO (the LCP
         element), so we preload the hero source — but ONLY on the landing
         route ("/"), so the app/auth routes (which share this static shell)
         never fetch a hero they don't render and the BUILD-07 route-split
         payload win still holds. The product SHOTS stay DOM/SVG (BUILD-12) —
         do NOT preload or rasterize those. -->
    <script>
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image";
        l.href = "/hero-choir-1280.webp";
        l.setAttribute("imagesrcset", "/hero-choir-960.webp 960w, /hero-choir-1280.webp 1280w, /hero-choir-1920.webp 1920w, /hero-choir-2560.webp 2560w");
        l.setAttribute("imagesizes", "100vw");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      }
    </script>
    <meta name="theme-color" content="#0f1a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Steward">
    <link rel="apple-touch-startup-image" href="/android-chrome-512x512.png">
    <meta property="og:title" content="Steward — The Fundraising OS for Nonprofits" />
    <meta property="og:description" content="Steward tells you who to call today, and what to say. Replace your spreadsheets with a system built for nonprofit fundraising." />
    <meta property="og:image" content="https://stewardapp.dev/og-image.png" />
    <meta property="og:url" content="https://stewardapp.dev" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Steward — The Fundraising OS for Nonprofits" />
    <meta name="twitter:description" content="Steward tells you who to call today, and what to say." />
    <meta name="twitter:image" content="https://stewardapp.dev/og-image.png" />
    <style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>
  </head>
