<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Right after the meeting, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
a{color:#0D5C3A}a:hover{color:#0A4A2E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #F0EDE6; font-family: 'DM Sans', system-ui, sans-serif; color: #0F1A12; padding: 56px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; letter-spacing: 0.12em; color: #8A6D1F; font-weight: 600">JUST NOW · 10:00 TO 10:52</div>
    <h1 style="margin: 0; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.12">How did coffee with Margaret go?</h1>
  </div>
  <form style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <label for="note" style="font-size: 13px; letter-spacing: 0.08em; color: #5A554F">WHAT HAPPENED</label>
    <textarea id="note" rows="5" style="font: 16px/1.5 'DM Sans', sans-serif; color: #0F1A12; border: 1px solid #E8E4DB; border-radius: 12px; padding: 12px; resize: none">She's in for the $25,000. Wants it split, half now and half in March. Asked if Lily can meet the scholarship students.</textarea>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; letter-spacing: 0.08em; color: #5A554F">STEWARD HEARD</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="padding: 7px 12px; border-radius: 999px; background: #E8E4DB; font-size: 14px">Pledge $25,000, 2 payments</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #E8E4DB; font-size: 14px">Youth Arts Access</span>
      </div>
    </div>
    <label for="next" style="font-size: 13px; letter-spacing: 0.08em; color: #5A554F">NEXT STEP</label>
    <input id="next" value="Invite Margaret and Lily to the studio open house, Oct 18" style="font: 16px 'DM Sans', sans-serif; color: #0F1A12; border: 1px solid #E8E4DB; border-radius: 12px; padding: 12px; min-height: 44px; box-sizing: border-box">
    <button type="submit" style="padding: 15px; min-height: 52px; border: 0; border-radius: 12px; background: #0D5C3A; color: #FFFFFF; font: 600 16px 'DM Sans', sans-serif; cursor: pointer">Save and record the pledge</button>
  </form>
  <div style="font-size: 13px; color: #5A554F; line-height: 1.5; padding: 0 4px">The meeting is already on her profile from your calendar. Saving adds your note, the pledge and the next step.</div>
</div>
</body>
</html>
